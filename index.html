<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STRIKEZONE：竞技战场</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    overflow:hidden;
    background:#05070d;
    color:white;
    font-family:Arial,"Microsoft YaHei",sans-serif;
}

button{
    font-family:inherit;
}

#game{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
}

/* ================= HUD ================= */

#hud{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:10;
}

.panel{
    background:rgba(10,15,28,.78);
    border:1px solid rgba(255,255,255,.15);
    border-radius:10px;
    backdrop-filter:blur(8px);
}

#topBar{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:20px;
    align-items:center;
    padding:10px 22px;
}

.teamScore{
    font-size:24px;
    font-weight:bold;
}

#blueScore{
    color:#55b8ff;
}

#redScore{
    color:#ff5a5a;
}

#roundInfo{
    font-size:14px;
    color:#ccc;
    text-align:center;
}

#stats{
    position:absolute;
    top:15px;
    left:15px;
    padding:12px;
    min-width:210px;
}

.stat{
    margin:5px 0;
    font-size:14px;
}

.bar{
    width:180px;
    height:12px;
    background:#222;
    border-radius:20px;
    overflow:hidden;
    margin-top:3px;
}

.fill{
    height:100%;
    transition:.2s;
}

#healthFill{
    background:#39d76a;
}

#armorFill{
    background:#55aaff;
}

#weaponInfo{
    position:absolute;
    bottom:20px;
    right:20px;
    padding:14px 18px;
    text-align:right;
}

#weaponName{
    font-size:22px;
    font-weight:bold;
}

#ammo{
    font-size:16px;
    color:#ddd;
}

#money{
    color:#ffd34d;
    font-size:18px;
    font-weight:bold;
}

#message{
    position:absolute;
    top:90px;
    left:50%;
    transform:translateX(-50%);
    font-size:28px;
    font-weight:bold;
    text-shadow:0 0 15px #000;
    text-align:center;
}

/* ================= ARENA ================= */

#arena{
    position:absolute;
    inset:0;
    background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
        radial-gradient(circle at center,#1b2332,#090c14 70%);
    background-size:50px 50px,50px 50px,100% 100%;
    cursor:crosshair;
}

.cover{
    position:absolute;
    background:linear-gradient(135deg,#384150,#161b24);
    border:2px solid #667083;
    border-radius:6px;
    box-shadow:0 10px 20px rgba(0,0,0,.4);
}

.wall1{
    width:240px;
    height:45px;
    left:18%;
    top:25%;
}

.wall2{
    width:50px;
    height:220px;
    left:45%;
    top:18%;
}

.wall3{
    width:240px;
    height:45px;
    right:14%;
    bottom:25%;
}

.wall4{
    width:50px;
    height:180px;
    left:28%;
    bottom:12%;
}

.wall5{
    width:160px;
    height:45px;
    right:25%;
    top:15%;
}

/* ================= PLAYER ================= */

.actor{
    position:absolute;
    width:34px;
    height:34px;
    border-radius:50%;
    transform:translate(-50%,-50%);
    transition:left .05s linear,top .05s linear;
}

.actor::after{
    content:"";
    position:absolute;
    width:24px;
    height:5px;
    background:#222;
    right:-18px;
    top:14px;
    border-radius:3px;
    transform-origin:left center;
}

.player{
    background:#45aaff;
    border:3px solid #d9f0ff;
    box-shadow:0 0 20px rgba(69,170,255,.8);
}

.enemy{
    background:#ff5252;
    border:3px solid #ffd1d1;
    box-shadow:0 0 18px rgba(255,70,70,.65);
}

.teammate{
    background:#55d8ff;
    border:3px solid white;
}

.nameTag{
    position:absolute;
    top:-30px;
    left:50%;
    transform:translateX(-50%);
    white-space:nowrap;
    font-size:12px;
    text-shadow:1px 1px 3px black;
}

.actorHP{
    position:absolute;
    top:-14px;
    left:50%;
    transform:translateX(-50%);
    width:42px;
    height:5px;
    background:#222;
    border-radius:10px;
    overflow:hidden;
}

.actorHP div{
    height:100%;
    background:#40e66a;
}

/* ================= BULLET ================= */

.bullet{
    position:absolute;
    width:9px;
    height:9px;
    border-radius:50%;
    background:#fff4a8;
    box-shadow:0 0 15px #ffcf42;
    pointer-events:none;
}

.tracer{
    position:absolute;
    height:2px;
    background:#ffd34d;
    transform-origin:left center;
    pointer-events:none;
}

/* ================= SHOP ================= */

#shop{
    position:absolute;
    z-index:30;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.65);
}

#shopBox{
    width:min(900px,95vw);
    max-height:88vh;
    overflow:auto;
    padding:22px;
}

.shopHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.shopHeader h2{
    color:#ffd34d;
}

.shopGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:12px;
}

.shopItem{
    background:#151b27;
    border:1px solid #394255;
    padding:15px;
    border-radius:10px;
}

.shopItem h3{
    margin-bottom:7px;
}

.shopItem p{
    color:#aaa;
    font-size:13px;
    min-height:40px;
}

.price{
    color:#ffd34d;
    font-weight:bold;
    margin:8px 0;
}

.shopItem button,
#closeShop,
#startButton,
#modeSelect button{
    width:100%;
    border:none;
    padding:10px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.buy{
    background:#357df0;
    color:white;
}

.buy:hover{
    filter:brightness(1.2);
}

.owned{
    background:#2a9d5b !important;
}

#closeShop{
    margin-top:15px;
    background:#555;
    color:white;
}

/* ================= START SCREEN ================= */

#menu{
    position:absolute;
    z-index:50;
    inset:0;
    background:
        radial-gradient(circle at center,rgba(37,63,100,.5),transparent 45%),
        #05070d;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

#menuBox{
    max-width:650px;
    padding:30px;
}

#menu h1{
    font-size:clamp(38px,7vw,80px);
    letter-spacing:4px;
    background:linear-gradient(90deg,#42aaff,#ffffff,#ff4f4f);
    -webkit-background-clip:text;
    color:transparent;
}

#menu p{
    margin:15px 0;
    color:#aaa;
}

#modeSelect{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin:25px 0;
}

#modeSelect button{
    background:#172033;
    color:white;
    border:1px solid #40506b;
}

#modeSelect button:hover{
    background:#2d5e9e;
}

#modeSelect button.active{
    background:#276fe3;
}

#startButton{
    background:#ffb52d;
    color:#111;
    font-size:18px;
}

/* ================= ROUND SCREEN ================= */

#roundOverlay{
    position:absolute;
    z-index:40;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.65);
    text-align:center;
}

#roundCard{
    padding:35px;
}

#roundTitle{
    font-size:42px;
    margin-bottom:10px;
}

#roundText{
    color:#ccc;
}

/* ================= BOTTOM HELP ================= */

#help{
    position:absolute;
    bottom:20px;
    left:20px;
    font-size:12px;
    color:#aaa;
    padding:10px;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    #topBar{
        gap:10px;
        padding:8px 12px;
    }

    #stats{
        transform:scale(.9);
        transform-origin:top left;
    }

    #help{
        display:none;
    }

    #modeSelect{
        grid-template-columns:1fr;
    }

}
</style>
</head>

<body>

<div id="game">

    <!-- MENU -->

    <div id="menu">

        <div id="menuBox">

            <h1>STRIKEZONE</h1>

            <h2>竞技战场</h2>

            <p>
                NPC 自动战斗 · 回合制竞技 · 武器永久拥有
            </p>

            <div id="modeSelect">

                <button class="mode active" data-mode="1">
                    1v1
                </button>

                <button class="mode" data-mode="2">
                    2v2
                </button>

                <button class="mode" data-mode="3">
                    3v3
                </button>

            </div>

            <button id="startButton">
                开始战斗
            </button>

        </div>

    </div>


    <!-- ARENA -->

    <div id="arena">

        <div class="cover wall1"></div>
        <div class="cover wall2"></div>
        <div class="cover wall3"></div>
        <div class="cover wall4"></div>
        <div class="cover wall5"></div>

    </div>


    <!-- HUD -->

    <div id="hud">

        <div id="stats" class="panel">

            <div class="stat">
                ❤️ 生命值
                <div class="bar">
                    <div class="fill" id="healthFill"></div>
                </div>
            </div>

            <div class="stat">
                🛡️ 护甲
                <div class="bar">
                    <div class="fill" id="armorFill"></div>
                </div>
            </div>

            <div class="stat">
                💰 <span id="money">1000</span>
            </div>

            <div class="stat">
                ⭐ 等级 <span id="level">1</span>
                · XP <span id="xp">0</span>/100
            </div>

            <div class="stat">
                🏆 MVP 击杀：
                <span id="kills">0</span>
            </div>

        </div>


        <div id="topBar" class="panel">

            <div class="teamScore" id="blueScore">
                0
            </div>

            <div id="roundInfo">
                第 <span id="round">1</span> 回合<br>
                先胜 5 回合
            </div>

            <div class="teamScore" id="redScore">
                0
            </div>

        </div>


        <div id="message"></div>


        <div id="weaponInfo" class="panel">

            <div id="weaponName">
                🔫 手枪
            </div>

            <div id="ammo">
                12 / 12
            </div>

        </div>


        <div id="help" class="panel">

            WASD 移动<br>
            鼠标瞄准 · 左键射击<br>
            R 换弹 · B 商店<br>
            1-6 切换武器 · F 医疗

        </div>

    </div>


    <!-- SHOP -->

    <div id="shop">

        <div id="shopBox" class="panel">

            <div class="shopHeader">

                <h2>
                    ⚔️ STRIKEZONE 军械商店
                </h2>

                <div>
                    💰 <span id="shopMoney">1000</span>
                </div>

            </div>

            <div class="shopGrid" id="shopGrid"></div>

            <button id="closeShop">
                返回战场
            </button>

        </div>

    </div>


    <!-- ROUND OVERLAY -->

    <div id="roundOverlay">

        <div id="roundCard" class="panel">

            <div id="roundTitle"></div>

            <div id="roundText"></div>

        </div>

    </div>

</div>


<script>

/* =========================================================
   STRIKEZONE：竞技战场
   第一版
========================================================= */


/* ================= GAME DATA ================= */

const weapons = {

    pistol:{
        name:"🔫 手枪",
        damage:20,
        headshot:40,
        mag:12,
        reload:1000,
        fireRate:350,
        price:0,
        range:500,
        spread:4
    },

    smg:{
        name:"🔥 冲锋枪",
        damage:10,
        headshot:18,
        mag:30,
        reload:1600,
        fireRate:100,
        price:500,
        range:330,
        spread:15
    },

    rifle:{
        name:"⚔️ 步枪",
        damage:24,
        headshot:48,
        mag:20,
        reload:1700,
        fireRate:180,
        price:800,
        range:700,
        spread:6
    },

    shotgun:{
        name:"💥 霰弹枪",
        damage:12,
        headshot:16,
        mag:6,
        reload:1800,
        fireRate:700,
        price:650,
        range:180,
        spread:35,
        pellets:8
    },

    sniper:{
        name:"🎯 狙击枪",
        damage:70,
        headshot:100,
        mag:5,
        reload:2200,
        fireRate:1000,
        price:1000,
        range:1000,
        spread:1
    },

    melee:{
        name:"🗡️ 近战",
        damage:45,
        headshot:45,
        mag:999,
        reload:0,
        fireRate:650,
        price:0,
        range:75,
        spread:0
    }

};


const equipment = {

    armor:{
        name:"🛡️ 护甲",
        price:350,
        type:"armor"
    },

    medkit:{
        name:"❤️ 医疗包",
        price:250,
        type:"medkit"
    }

};


/* ================= GAME STATE ================= */

let mode = 1;

let player = null;

let teammates = [];

let enemies = [];

let keys = {};

let mouseX = 0;
let mouseY = 0;

let shooting = false;

let gameRunning = false;

let roundActive = false;

let reloading = false;

let lastShot = 0;

let blueScore = 0;
let redScore = 0;

let round = 1;

let animationId = null;


/* ================= PLAYER PROFILE ================= */

const profile = {

    money:1000,

    level:1,

    xp:0,

    kills:0,

    wins:0,

    losses:0,

    rating:1000,

    ownedWeapons:[
        "pistol",
        "melee"
    ],

    currentWeapon:"pistol",

    ammo:{},

    armor:0,

    medkits:0

};


for(const key in weapons){
    profile.ammo[key] = weapons[key].mag;
}


/* ================= ELEMENTS ================= */

const arena = document.getElementById("arena");

const menu = document.getElementById("menu");

const shop = document.getElementById("shop");

const shopGrid = document.getElementById("shopGrid");

const roundOverlay = document.getElementById("roundOverlay");

const message = document.getElementById("message");


/* ================= MODE SELECT ================= */

document.querySelectorAll(".mode").forEach(button=>{

    button.onclick = ()=>{

        document.querySelectorAll(".mode").forEach(b=>{
            b.classList.remove("active");
        });

        button.classList.add("active");

        mode = Number(button.dataset.mode);

    };

});


document.getElementById("startButton").onclick = ()=>{

    menu.style.display = "none";

    startGame();

};


/* ================= START GAME ================= */

function startGame(){

    blueScore = 0;
    redScore = 0;

    round = 1;

    gameRunning = true;

    updateHUD();

    startRound();

}


/* ================= ROUND ================= */

function startRound(){

    clearActors();

    roundActive = false;

    showRound(
        "第 " + round + " 回合",
        "购买阶段 · 按 B 打开商店",
        2200
    );

    resetPlayer();

    spawnTeams();

    setTimeout(()=>{

        if(!gameRunning) return;

        roundActive = true;

        showMessage("战斗开始！",1200);

    },2300);

}


function resetPlayer(){

    player = createActor(
        "player",
        120,
        window.innerHeight / 2,
        "YOU"
    );

    player.hp = 100;

    player.maxHp = 100;

    player.armor = profile.armor;

    player.dead = false;

}


/* ================= SPAWN TEAMS ================= */

function spawnTeams(){

    teammates = [];

    enemies = [];

    for(let i=1;i<mode;i++){

        const mate = createActor(
            "teammate",
            120,
            window.innerHeight / 2 + i * 80,
            "ALLY " + i
        );

        mate.hp = 100;
        mate.maxHp = 100;
        mate.dead = false;
        mate.ai = true;
        mate.team = "blue";

        teammates.push(mate);

    }


    for(let i=0;i<mode;i++){

        const enemy = createActor(
            "enemy",
            window.innerWidth - 120,
            150 + i * (window.innerHeight / (mode + 1)),
            "BOT " + (i+1)
        );

        enemy.hp = 100;
        enemy.maxHp = 100;
        enemy.dead = false;
        enemy.ai = true;
        enemy.team = "red";
        enemy.lastAIShot = 0;

        enemies.push(enemy);

    }

}


/* ================= CREATE ACTOR ================= */

function createActor(type,x,y,name){

    const el = document.createElement("div");

    el.className = "actor " + type;

    el.style.left = x + "px";

    el.style.top = y + "px";


    const tag = document.createElement("div");

    tag.className = "nameTag";

    tag.textContent = name;


    const hpBar = document.createElement("div");

    hpBar.className = "actorHP";

    const hpFill = document.createElement("div");

    hpFill.style.width = "100%";

    hpBar.appendChild(hpFill);


    el.appendChild(tag);

    el.appendChild(hpBar);

    arena.appendChild(el);


    return {

        el,

        x,

        y,

        name,

        hp:100,

        maxHp:100,

        hpFill,

        dead:false

    };

}


/* ================= CLEAR ================= */

function clearActors(){

    arena.querySelectorAll(".actor,.bullet,.tracer")
        .forEach(el=>el.remove());

}


/* ================= MOVEMENT ================= */

document.addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()] = true;


    if(e.key.toLowerCase() === "b"){

        if(gameRunning && !reloading){

            toggleShop();

        }

    }


    if(e.key.toLowerCase() === "r"){

        reloadWeapon();

    }


    if(e.key.toLowerCase() === "f"){

        useMedkit();

    }


    const number = Number(e.key);

    if(number >= 1 && number <= 6){

        const order = [
            "pistol",
            "smg",
            "rifle",
            "shotgun",
            "sniper",
            "melee"
        ];

        const weaponKey = order[number-1];

        if(profile.ownedWeapons.includes(weaponKey)){

            equipWeapon(weaponKey);

        }else{

            showMessage("你还没有购买这把武器！",1200);

        }

    }

});


document.addEventListener("keyup",e=>{

    keys[e.key.toLowerCase()] = false;

});


arena.addEventListener("mousemove",e=>{

    const rect = arena.getBoundingClientRect();

    mouseX = e.clientX - rect.left;

    mouseY = e.clientY - rect.top;

});


arena.addEventListener("mousedown",e=>{

    if(e.button === 0){

        shooting = true;

        shoot();

    }

});


document.addEventListener("mouseup",()=>{

    shooting = false;

});


/* ================= GAME LOOP ================= */

function gameLoop(){

    if(gameRunning){

        movePlayer();

        updateAI();

        if(shooting){

            shoot();

        }

        checkRound();

    }

    animationId = requestAnimationFrame(gameLoop);

}

gameLoop();


/* ================= PLAYER MOVE ================= */

function movePlayer(){

    if(!roundActive || !player || player.dead) return;

    const speed = 4.2;

    let dx = 0;
    let dy = 0;

    if(keys["w"]) dy -= speed;
    if(keys["s"]) dy += speed;
    if(keys["a"]) dx -= speed;
    if(keys["d"]) dx += speed;


    player.x += dx;

    player.y += dy;


    player.x = Math.max(25,Math.min(window.innerWidth-25,player.x));

    player.y = Math.max(25,Math.min(window.innerHeight-25,player.y));


    player.el.style.left = player.x + "px";

    player.el.style.top = player.y + "px";


    const angle = Math.atan2(
        mouseY-player.y,
        mouseX-player.x
    ) * 180 / Math.PI;

    player.el.style.setProperty(
        "transform",
        "translate(-50%,-50%) rotate(" + angle + "deg)"
    );

}


/* ================= SHOOT ================= */

function shoot(){

    if(!roundActive) return;

    if(!player || player.dead) return;

    if(reloading) return;

    const weaponKey = profile.currentWeapon;

    const weapon = weapons[weaponKey];

    const now = Date.now();


    if(now - lastShot < weapon.fireRate) return;


    if(profile.ammo[weaponKey] <= 0){

        reloadWeapon();

        return;

    }


    lastShot = now;


    if(weaponKey === "melee"){

        meleeAttack();

        return;

    }


    profile.ammo[weaponKey]--;


    const pellets = weapon.pellets || 1;


    for(let i=0;i<pellets;i++){

        fireBullet(weapon);

    }


    updateHUD();

}


/* ================= BULLET ================= */

function fireBullet(weapon){

    let dx = mouseX-player.x;

    let dy = mouseY-player.y;

    const distance = Math.hypot(dx,dy);

    dx /= distance;
    dy /= distance;


    const spreadAngle =
        (Math.random()-.5) *
        weapon.spread *
        Math.PI / 180;


    const cos = Math.cos(spreadAngle);

    const sin = Math.sin(spreadAngle);


    const newDx = dx*cos - dy*sin;

    const newDy = dx*sin + dy*cos;


    const bullet = document.createElement("div");

    bullet.className = "bullet";


    let x = player.x;

    let y = player.y;


    arena.appendChild(bullet);


    const speed = 18;

    let travelled = 0;


    function bulletLoop(){

        x += newDx * speed;

        y += newDy * speed;

        travelled += speed;


        bullet.style.left = x + "px";

        bullet.style.top = y + "px";


        const targets = enemies;


        for(const target of targets){

            if(target.dead) continue;


            const d = Math.hypot(
                target.x-x,
                target.y-y
            );


            if(d < 25){

                let damage = weapon.damage;


                const headshot =
                    Math.random() < .18;


                if(headshot){

                    damage = weapon.headshot;

                }


                damage *= getDamageMultiplier(
                    travelled,
                    weapon.range
                );


                damageActor(
                    target,
                    damage,
                    headshot,
                    "player"
                );


                bullet.remove();

                return;

            }

        }


        if(
            travelled < weapon.range &&
            x > 0 &&
            x < window.innerWidth &&
            y > 0 &&
            y < window.innerHeight
        ){

            requestAnimationFrame(bulletLoop);

        }else{

            bullet.remove();

        }

    }


    bulletLoop();

}


/* ================= DAMAGE FALL OFF ================= */

function getDamageMultiplier(distance,range){

    if(distance < range * .5){

        return 1;

    }

    if(distance < range * .8){

        return .8;

    }

    return .6;

}


/* ================= MELEE ================= */

function meleeAttack(){

    const weapon = weapons.melee;

    let closest = null;

    let closestDistance = 9999;


    enemies.forEach(enemy=>{

        if(enemy.dead) return;

        const d = Math.hypot(
            enemy.x-player.x,
            enemy.y-player.y
        );


        if(d < closestDistance){

            closestDistance = d;

            closest = enemy;

        }

    });


    if(closest && closestDistance <= weapon.range){

        damageActor(
            closest,
            weapon.damage,
            false,
            "player"
        );

    }else{

        showMessage("目标太远！",500);

    }

}


/* ================= DAMAGE ================= */

function damageActor(target,damage,headshot,attacker){

    if(target.dead) return;


    if(target.armor && target.armor > 0){

        const absorbed = damage * .35;

        target.armor -= absorbed;

        damage -= absorbed;

    }


    target.hp -= damage;


    target.hpFill.style.width =
        Math.max(0,target.hp) /
        target.maxHp *
        100 + "%";


    if(target === player){

        updateHUD();

    }


    if(headshot){

        showMessage("💥 爆头！",500);

    }


    if(target.hp <= 0){

        killActor(target,attacker);

    }

}


/* ================= KILL ================= */

function killActor(target,attacker){

    if(target.dead) return;

    target.dead = true;

    target.hp = 0;

    target.el.style.opacity = ".25";

    target.el.style.filter = "grayscale(1)";

    target.el.style.pointerEvents = "none";


    if(attacker === "player"){

        profile.kills++;

        profile.xp += 20;

        profile.money += 100;

        showMessage(
            "☠️ 击杀 +100 金币",
            900
        );

        checkLevel();

        updateHUD();

    }

}


/* ================= AI ================= */

function updateAI(){

    if(!roundActive) return;


    /* ALLY NPC */

    teammates.forEach(bot=>{

        if(bot.dead) return;


        const target = findClosestEnemy(bot);


        if(!target) return;


        moveAI(bot,target);


        if(Date.now() - (bot.lastAIShot || 0) > 650){

            const distance = Math.hypot(
                bot.x-target.x,
                bot.y-target.y
            );


            if(distance < 500){

                bot.lastAIShot = Date.now();

                aiShoot(bot,target,"ally");

            }

        }

    });


    /* ENEMY NPC */

    enemies.forEach(bot=>{

        if(bot.dead) return;


        const target = findClosestBlue(bot);


        if(!target) return;


        moveAI(bot,target);


        if(Date.now() - bot.lastAIShot > 750){

            const distance = Math.hypot(
                bot.x-target.x,
                bot.y-target.y
            );


            if(distance < 500){

                bot.lastAIShot = Date.now();

                aiShoot(bot,target,"enemy");

            }

        }

    });

}


/* ================= AI FIND TARGET ================= */

function findClosestEnemy(bot){

    let target = null;

    let min = Infinity;


    enemies.forEach(enemy=>{

        if(enemy.dead) return;

        const d = Math.hypot(
            enemy.x-bot.x,
            enemy.y-bot.y
        );


        if(d < min){

            min = d;

            target = enemy;

        }

    });


    return target;

}


function findClosestBlue(bot){

    const blues = [player,...teammates];

    let target = null;

    let min = Infinity;


    blues.forEach(unit=>{

        if(!unit || unit.dead) return;

        const d = Math.hypot(
            unit.x-bot.x,
            unit.y-bot.y
        );


        if(d < min){

            min = d;

            target = unit;

        }

    });


    return target;

}


/* ================= AI MOVE ================= */

function moveAI(bot,target){

    const dx = target.x-bot.x;

    const dy = target.y-bot.y;

    const distance = Math.hypot(dx,dy);


    if(distance > 260){

        bot.x += dx/distance * 1.25;

        bot.y += dy/distance * 1.25;

    }


    bot.x = Math.max(
        25,
        Math.min(window.innerWidth-25,bot.x)
    );

    bot.y = Math.max(
        25,
        Math.min(window.innerHeight-25,bot.y)
    );


    bot.el.style.left = bot.x+"px";

    bot.el.style.top = bot.y+"px";


    const angle =
        Math.atan2(dy,dx) *
        180/Math.PI;


    bot.el.style.transform =
        "translate(-50%,-50%) rotate("+
        angle+
        "deg)";

}


/* ================= AI SHOOT ================= */

function aiShoot(bot,target,type){

    if(target.dead) return;


    const accuracy =
        Math.random();


    let hitChance =
        type === "enemy" ?
        .48 :
        .55;


    if(accuracy > hitChance){

        createTracer(
            bot.x,
            bot.y,
            target.x + (Math.random()-.5)*100,
            target.y + (Math.random()-.5)*100
        );

        return;

    }


    createTracer(
        bot.x,
        bot.y,
        target.x,
        target.y
    );


    let damage =
        8 + Math.random()*12;


    const headshot =
        Math.random() < .08;


    if(headshot){

        damage *= 2;

    }


    damageActor(
        target,
        damage,
        headshot,
        type
    );

}


/* ================= TRACER ================= */

function createTracer(x1,y1,x2,y2){

    const tracer =
        document.createElement("div");

    tracer.className = "tracer";


    const dx = x2-x1;

    const dy = y2-y1;

    const length =
        Math.hypot(dx,dy);

    const angle =
        Math.atan2(dy,dx) *
        180/Math.PI;


    tracer.style.left = x1+"px";

    tracer.style.top = y1+"px";

    tracer.style.width = length+"px";

    tracer.style.transform =
        "rotate("+angle+"deg)";


    arena.appendChild(tracer);


    setTimeout(()=>{

        tracer.remove();

    },80);

}


/* ================= ROUND CHECK ================= */

function checkRound(){

    if(!roundActive) return;


    const blueAlive =
        [player,...teammates]
        .some(unit=>unit && !unit.dead);


    const redAlive =
        enemies
        .some(unit=>!unit.dead);


    if(!blueAlive){

        endRound("red");

    }


    if(!redAlive){

        endRound("blue");

    }

}


/* ================= END ROUND ================= */

function endRound(winner){

    if(!roundActive) return;

    roundActive = false;


    if(winner === "blue"){

        blueScore++;

        profile.money += 300;

        profile.wins++;

        profile.xp += 30;


        showRound(
            "🔵 本回合胜利！",
            "+300 金币 · +30 XP",
            2500
        );

    }else{

        redScore++;

        profile.money += 150;

        profile.losses++;

        showRound(
            "🔴 本回合失败",
            "+150 金币",
            2500
        );

    }


    checkLevel();

    updateHUD();


    if(blueScore >= 5 || redScore >= 5){

        setTimeout(endMatch,2600);

        return;

    }


    round++;


    setTimeout(()=>{

        startRound();

    },2700);

}


/* ================= END MATCH ================= */

function endMatch(){

    gameRunning = false;

    roundActive = false;


    const won =
        blueScore > redScore;


    if(won){

        profile.rating += 25;

        profile.xp += 50;


        showRound(
            "🏆 比赛胜利！",
            "最终比分 "+
            blueScore+
            " : "+
            redScore+
            " · MVP 击杀 "+
            profile.kills+
            " · 排位 +25",
            5000
        );

    }else{

        profile.rating =
            Math.max(
                0,
                profile.rating-10
            );


        showRound(
            "比赛结束",
            "最终比分 "+
            blueScore+
            " : "+
            redScore+
            " · 下次再战！",
            5000
        );

    }


    checkLevel();

    updateHUD();


    setTimeout(()=>{

        menu.style.display="flex";

        roundOverlay.style.display="none";

    },5200);

}


/* ================= SHOP ================= */

function toggleShop(){

    if(shop.style.display === "flex"){

        shop.style.display = "none";

    }else{

        renderShop();

        shop.style.display = "flex";

    }

}


function renderShop(){

    shopGrid.innerHTML = "";

    document.getElementById(
        "shopMoney"
    ).textContent = profile.money;


    for(const key in weapons){

        const weapon = weapons[key];

        const owned =
            profile.ownedWeapons.includes(key);


        const item =
            document.createElement("div");

        item.className="shopItem";


        item.innerHTML = `

            <h3>${weapon.name}</h3>

            <p>
                伤害 ${weapon.damage}
                · 弹匣 ${weapon.mag}
            </p>

            <div class="price">

                ${
                    weapon.price === 0
                    ?
                    "免费"
                    :
                    "💰 "+weapon.price
                }

            </div>

            <button
                class="buy ${
                    owned ? "owned" : ""
                }"
            >

                ${
                    owned
                    ?
                    "✓ 已拥有 · 装备"
                    :
                    "购买"
                }

            </button>

        `;


        item.querySelector("button")
        .onclick = ()=>{

            buyWeapon(key);

        };


        shopGrid.appendChild(item);

    }


    for(const key in equipment){

        const itemData =
            equipment[key];


        const item =
            document.createElement("div");

        item.className="shopItem";


        item.innerHTML=`

            <h3>${itemData.name}</h3>

            <p>
                ${
                    key === "armor"
                    ?
                    "减少受到的伤害"
                    :
                    "恢复生命值"
                }
            </p>

            <div class="price">
                💰 ${itemData.price}
            </div>

            <button class="buy">
                购买
            </button>

        `;


        item.querySelector("button")
        .onclick = ()=>{

            buyEquipment(key);

        };


        shopGrid.appendChild(item);

    }

}


/* ================= BUY WEAPON ================= */

function buyWeapon(key){

    const weapon =
        weapons[key];


    /* 已经买过 */

    if(profile.ownedWeapons.includes(key)){

        equipWeapon(key);

        renderShop();

        showMessage(
            "已装备 "+weapon.name,
            900
        );

        return;

    }


    /* 钱不够 */

    if(profile.money < weapon.price){

        showMessage(
            "💰 金币不足！",
            1000
        );

        return;

    }


    /* 购买 */

    profile.money -= weapon.price;


    profile.ownedWeapons.push(key);


    /* 重要：
       买过以后永久存在
       不会在下一回合消失
    */

    profile.ammo[key] =
        weapon.mag;


    profile.currentWeapon =
        key;


    updateHUD();

    renderShop();


    showMessage(
        "购买成功！"+weapon.name,
        1200
    );

}


/* ================= EQUIP ================= */

function equipWeapon(key){

    if(
        !profile.ownedWeapons.includes(key)
    ) return;


    profile.currentWeapon =
        key;


    const weapon =
        weapons[key];


    if(profile.ammo[key] === undefined){

        profile.ammo[key] =
            weapon.mag;

    }


    updateHUD();

}


/* ================= EQUIPMENT ================= */

function buyEquipment(key){

    const item =
        equipment[key];


    if(profile.money < item.price){

        showMessage(
            "💰 金币不足！",
            1000
        );

        return;

    }


    profile.money -= item.price;


    if(key === "armor"){

        profile.armor = 100;

        if(player && !player.dead){

            player.armor = 100;

        }

    }


    if(key === "medkit"){

        profile.medkits++;

    }


    updateHUD();

    renderShop();


    showMessage(
        item.name+" 购买成功！",
        1000
    );

}


/* ================= MEDKIT ================= */

function useMedkit(){

    if(!player || player.dead) return;


    if(profile.medkits <= 0){

        showMessage(
            "没有医疗包！",
            800
        );

        return;

    }


    if(player.hp >= player.maxHp){

        showMessage(
            "生命值已经满了！",
            800
        );

        return;

    }


    profile.medkits--;


    player.hp =
        Math.min(
            player.maxHp,
            player.hp+50
        );


    player.hpFill.style.width =
        player.hp+"%";


    updateHUD();


    showMessage(
        "❤️ 恢复生命 +50",
        1000
    );

}


/* ================= RELOAD ================= */

function reloadWeapon(){

    if(reloading) return;

    if(!player || player.dead) return;


    const key =
        profile.currentWeapon;

    const weapon =
        weapons[key];


    if(key === "melee") return;


    if(
        profile.ammo[key] >=
        weapon.mag
    ){

        return;

    }


    reloading = true;


    showMessage(
        "🔄 换弹中...",
        weapon.reload
    );


    setTimeout(()=>{

        profile.ammo[key] =
            weapon.mag;

        reloading = false;

        updateHUD();

    },weapon.reload);

}


/* ================= LEVEL ================= */

function checkLevel(){

    while(profile.xp >= 100){

        profile.xp -= 100;

        profile.level++;

        profile.money += 200;

        showMessage(
            "⭐ 升级！等级 "+
            profile.level+
            " · +200 金币",
            1500
        );

    }

}


/* ================= HUD ================= */

function updateHUD(){

    const hp =
        player ?
        Math.max(0,player.hp)
        :
        100;


    const armor =
        player ?
        Math.max(0,player.armor || 0)
        :
        profile.armor;


    document.getElementById(
        "healthFill"
    ).style.width =
        hp+"%";


    document.getElementById(
        "armorFill"
    ).style.width =
        armor+"%";


    document.getElementById(
        "money"
    ).textContent =
        profile.money;


    document.getElementById(
        "level"
    ).textContent =
        profile.level;


    document.getElementById(
        "xp"
    ).textContent =
        profile.xp;


    document.getElementById(
        "kills"
    ).textContent =
        profile.kills;


    document.getElementById(
        "blueScore"
    ).textContent =
        blueScore;


    document.getElementById(
        "redScore"
    ).textContent =
        redScore;


    document.getElementById(
        "round"
    ).textContent =
        round;


    const weapon =
        weapons[
            profile.currentWeapon
        ];


    document.getElementById(
        "weaponName"
    ).textContent =
        weapon.name;


    document.getElementById(
        "ammo"
    ).textContent =

        profile.currentWeapon ===
        "melee"

        ?

        "∞"

        :

        profile.ammo[
            profile.currentWeapon
        ]

        +

        " / "

        +

        weapon.mag;

}


/* ================= MESSAGE ================= */

function showMessage(text,time=1000){

    message.textContent=text;

    message.style.opacity="1";


    setTimeout(()=>{

        message.style.opacity="0";

    },time);

}


/* ================= ROUND CARD ================= */

function showRound(title,text,time){

    document.getElementById(
        "roundTitle"
    ).textContent=title;


    document.getElementById(
        "roundText"
    ).textContent=text;


    roundOverlay.style.display="flex";


    setTimeout(()=>{

        roundOverlay.style.display="none";

    },time);

}


/* ================= CLOSE SHOP ================= */

document.getElementById(
    "closeShop"
).onclick=()=>{

    shop.style.display="none";

};


/* ================= WINDOW RESIZE ================= */

window.addEventListener(
    "resize",
    ()=>{

        if(player){

            player.x=Math.min(
                player.x,
                window.innerWidth-30
            );

            player.y=Math.min(
                player.y,
                window.innerHeight-30
            );

        }

    }
);


/* ================= INITIAL HUD ================= */

updateHUD();

</script>
